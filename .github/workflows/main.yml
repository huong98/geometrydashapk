name: Deploy HawkHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to HawkHost
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          script: |
            cd /home/noithatgoo/geometrydashapk.games

            git fetch --all
            git reset --hard origin/main
            git clean -fd

            git pull origin main
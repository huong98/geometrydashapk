name: Deploy HawkHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to HawkHost
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          script: |
            cd /home/noithatgoo/geometrydashapk.games

            PRESERVE_DIR="/tmp/geometrydashapk-admin-content"
            rm -rf "$PRESERVE_DIR"
            mkdir -p "$PRESERVE_DIR/Blog"

            if [ -f blog.html ]; then
              cp blog.html "$PRESERVE_DIR/blog.html"
            fi

            if [ -d Blog ]; then
              find Blog -maxdepth 1 -type f -name '*.html' -exec cp {} "$PRESERVE_DIR/Blog/" \;
            fi

            git fetch --all
            git reset --hard origin/main
            git clean -fd

            git pull origin main

            if [ -f "$PRESERVE_DIR/blog.html" ]; then
              cp "$PRESERVE_DIR/blog.html" blog.html
            fi

            if [ -d "$PRESERVE_DIR/Blog" ]; then
              mkdir -p Blog
              cp -n "$PRESERVE_DIR/Blog/"*.html Blog/ 2>/dev/null || true
            fi

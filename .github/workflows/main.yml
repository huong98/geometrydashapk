name: Deploy HawkHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to HawkHost
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          script: |
            cd /home/noithatgoo/geometrydashapk.games

            PRESERVE_DIR="/tmp/geometrydashapk-admin-content"
            rm -rf "$PRESERVE_DIR"
            mkdir -p "$PRESERVE_DIR/root" "$PRESERVE_DIR/Blog"

            if ls *.html >/dev/null 2>&1; then
              for file in *.html; do
                case "$file" in
                  admin.html|404.html)
                    ;;
                  *)
                    cp "$file" "$PRESERVE_DIR/root/"
                    ;;
                esac
              done
            fi

            if [ -d Blog ]; then
              find Blog -maxdepth 1 -type f -name '*.html' -exec cp {} "$PRESERVE_DIR/Blog/" \;
            fi

            git fetch --all
            git reset --hard origin/main
            git clean -fd

            git pull origin main

            if [ -d "$PRESERVE_DIR/root" ]; then
              cp "$PRESERVE_DIR/root/"*.html . 2>/dev/null || true
            fi

            if [ -d "$PRESERVE_DIR/Blog" ]; then
              mkdir -p Blog
              cp "$PRESERVE_DIR/Blog/"*.html Blog/ 2>/dev/null || true
            fi
